<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B3E5FC">
<title>Ойнаймын және үйренемін! — №221 мектеп</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --fs:1;--bs:1;
  --ink:#33275A;--ink2:#5E4F8C;--card:#ffffff;--line:#E3D9F7;
  --bgA:#B3E5FC;--bgB:#E9F8FF;--bgC:#FFF6CC;
  --shadow:0 .45rem 0 rgba(51,39,90,.14);
  --good:#43C463;--goodD:#2E9E4A;
  --sec:#81D4FA;--secD:#0288D1;--secS:#E1F5FE;
}
html{font-size:calc(19px * var(--fs));-webkit-text-size-adjust:100%}
@media (max-width:640px){html{font-size:calc(16px * var(--fs))}}
body{
  font-family:"Nunito","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-weight:800;color:var(--ink);line-height:1.3;
  background:linear-gradient(180deg,var(--bgA) 0%,var(--bgB) 45%,var(--bgC) 100%);
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
body.bigbtn{--bs:1.28}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:5px solid #FF4081;outline-offset:4px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Фон безендірулері ---------- */
#decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#decor .d{position:absolute}
#decor .d svg{width:100%;height:auto}
.drift{left:0;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.twinkle{animation:twinkle 2.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.decnum{font-size:5rem;font-weight:900;opacity:.28;line-height:1}
.sway2{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
@media (max-width:640px){#decor{opacity:.55}}

/* ---------- SVG анимациялары ---------- */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.spin.slow{animation-duration:40s}
@keyframes spin{to{transform:rotate(360deg)}}
.pi{transform-box:fill-box;transform-origin:center;animation:popIn .7s cubic-bezier(.3,1.6,.5,1) both}
.pi.d2{animation-delay:.25s}.pi.d3{animation-delay:.5s}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.bounce{transform-box:fill-box;transform-origin:center bottom;animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.rise{animation:rise 3.4s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(60px);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(-70px);opacity:0}}
.flap{transform-box:fill-box;transform-origin:30% 95%;animation:flap .35s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
.flap2{transform-box:view-box;transform-origin:50% 50%;animation:flap2 .3s ease-in-out infinite alternate}
@keyframes flap2{from{transform:scaleX(1)}to{transform:scaleX(.35)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
.tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}
.tw.b{animation-delay:.6s}.tw.c{animation-delay:1.2s}

/* ---------- Жоғарғы панель ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  padding:.55rem clamp(.6rem,2vw,1.4rem);background:rgba(255,255,255,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:4px solid var(--line)}
.hgroup{display:flex;gap:.5rem;align-items:center}
.hbtn{display:flex;align-items:center;gap:.45rem;min-height:calc(3.1rem * var(--bs));padding:.35rem 1rem;border-radius:999px;background:#fff;
  border:4px solid var(--line);box-shadow:0 .3rem 0 rgba(51,39,90,.15);font-size:calc(1.02rem * var(--bs));transition:transform .15s}
.hbtn:active{transform:translateY(3px);box-shadow:none}
.hbtn .hi{font-size:1.45em;line-height:1}
.hbtn.off{opacity:.6}
.hbtn.hide{visibility:hidden}
#homeBtn{background:#DFF5DF;border-color:#81C784}
#a11yBtn{background:#FFF59D;border-color:#FBC02D}
.starbox{display:flex;align-items:center;gap:.35rem;font-size:calc(1.55rem * var(--bs));background:#FFF8E1;border:4px solid #FFD54F;border-radius:999px;padding:.15rem 1rem .15rem .55rem;min-height:calc(3.1rem * var(--bs))}
.starbox svg{width:2.1rem;height:2.1rem}
.starbox.bump{animation:bump .55s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
@media (max-width:780px){.hl{display:none}.hbtn{padding:.35rem .65rem}}

/* ---------- Негізгі аймақ ---------- */
#app{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:1rem clamp(.8rem,3vw,2rem) 3rem}
.screen{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Басты бет ---------- */
.hero{text-align:center;padding:.6rem 0 .2rem}
.title{font-size:clamp(2.05rem,6.4vw,4.3rem);font-weight:900;line-height:1.12;margin:.4rem 0 1rem;letter-spacing:.02em}
.title .w{display:inline-block;white-space:nowrap;margin:0 .18em}
.title .l{display:inline-block;animation:wave 2.4s ease-in-out infinite;text-shadow:0 .07em 0 #fff,0 .14em 0 rgba(51,39,90,.18)}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-.12em)}}
.greet{display:flex;align-items:center;justify-content:center;gap:1.2rem;flex-wrap:wrap;margin:0 auto 1.1rem}
.mascot{width:clamp(96px,14vw,136px);flex:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.mascot.talking,.mini.talking{animation:talk .32s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.09) rotate(4deg)}}
.bubble{position:relative;background:var(--card);border:4px solid var(--line);border-radius:1.7rem;padding:1rem 1.4rem;max-width:640px;box-shadow:var(--shadow);text-align:left}
.bubble p{font-size:clamp(1.25rem,2.6vw,1.7rem);margin-bottom:.7rem}
.bubble::before{content:"";position:absolute;left:-26px;top:50%;transform:translateY(-50%);border:13px solid transparent;border-right-color:var(--line)}
@media (max-width:640px){.bubble::before{display:none}.bubble{text-align:center}}
.school{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:.4rem 1.2rem;background:rgba(255,255,255,.85);border:3px dashed #CE93D8;border-radius:1.2rem;padding:.6rem 1.2rem;font-size:1.05rem;color:var(--ink2);margin-bottom:1.2rem}
.hint{text-align:center;font-size:1.3rem;margin:.4rem 0 1.4rem;color:var(--ink2)}
.champ{text-align:center;font-size:clamp(1.3rem,3vw,1.8rem);background:linear-gradient(90deg,#FFF59D,#F8BBD0,#B3E5FC);border:4px solid #FFD54F;border-radius:1.5rem;padding:.8rem 1.2rem;margin:0 auto 1.4rem;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.1rem,2.5vw,1.8rem)}
@media (max-width:900px){.cards{grid-template-columns:1fr;max-width:560px;margin:0 auto}}
.scard{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;padding:1.5rem 1.1rem 1.4rem;border-radius:2rem;
  background:var(--c2);border:5px solid var(--c1);box-shadow:0 .6rem 0 var(--c3);transition:transform .2s,box-shadow .2s}
.scard:hover{transform:translateY(-6px) rotate(-1deg)}
.scard:active{transform:translateY(5px);box-shadow:0 .15rem 0 var(--c3)}
.scard .pic{width:min(190px,58%);aspect-ratio:1}
.scard .pic svg{width:100%;height:100%}
.scard .stitle{font-size:clamp(1.35rem,2.3vw,1.7rem);line-height:1.15;font-weight:900}
.scard .sgoal{font-size:1.02rem;color:var(--ink2)}
.scard .num{position:absolute;top:-1rem;left:-.7rem;width:3.1rem;height:3.1rem;border-radius:50%;background:var(--c3);color:#fff;display:grid;place-items:center;font-size:1.55rem;border:4px solid #fff;box-shadow:0 .2rem 0 rgba(0,0,0,.12)}
.pstars{display:flex;gap:.35rem}
.pstars .s{width:2.1rem;height:2.1rem;opacity:.25;filter:grayscale(1)}
.pstars .s.on{opacity:1;filter:none}
.go{display:inline-flex;align-items:center;gap:.5rem;background:var(--c3);color:#fff;font-size:calc(1.4rem * var(--bs));padding:calc(.7rem * var(--bs)) calc(1.8rem * var(--bs));border-radius:999px;box-shadow:0 .35rem 0 rgba(0,0,0,.22);margin-top:.2rem}

/* ---------- Тапсырма беті ---------- */
.taskhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.secchip{display:flex;align-items:center;gap:.6rem;background:var(--card);border:4px solid var(--sec);border-radius:999px;padding:.35rem 1.2rem .35rem .45rem;font-size:1.2rem}
.secchip .ic{width:2.7rem;height:2.7rem}
.secchip .ic svg{width:100%;height:100%}
.dots{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.dot{width:calc(3rem * var(--bs));height:calc(3rem * var(--bs));border-radius:50%;background:var(--card);border:4px solid var(--line);display:grid;place-items:center;font-size:1.25rem;color:var(--ink2);transition:transform .2s}
.dot.cur{border-color:var(--secD);transform:scale(1.14);color:var(--ink);box-shadow:0 0 0 5px var(--secS)}
.dot.done{background:#FFD54F;border-color:#F9A825;color:#7A4A00}
.count{font-size:1.2rem;margin-left:.3rem}
.tcard{position:relative;background:var(--card);border:5px solid var(--sec);border-radius:2.2rem;padding:clamp(1rem,3vw,2rem);box-shadow:0 .7rem 0 var(--secD);overflow:hidden}
.ttitle{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.5rem;background:var(--secS);border:3px solid var(--sec);border-radius:999px;padding:.3rem 1.1rem;font-size:1.12rem;margin-bottom:.7rem}
.donebadge{background:#C8F7C5;border-radius:999px;padding:.05rem .7rem;color:#1B5E20}
.qrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.q{font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.2;font-weight:900}
.listen{display:inline-flex;align-items:center;gap:.5rem;background:#FFF59D;border:4px solid #FBC02D;border-radius:999px;padding:calc(.55rem * var(--bs)) calc(1.1rem * var(--bs));font-size:calc(1.12rem * var(--bs));box-shadow:0 .3rem 0 #F9A825;transition:transform .15s}
.listen:active{transform:translateY(3px);box-shadow:none}
.listen .li{font-size:1.4em;line-height:1}
.scene{margin:1rem auto .4rem;max-width:660px;border-radius:1.6rem;overflow:hidden;background:var(--secS);border:4px solid var(--secS)}
.scene svg{width:100%;height:auto;max-height:44vh}
.opts{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(.7rem,2vw,1.4rem);margin-top:1.2rem}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:.7rem;min-height:calc(5.2rem * var(--bs));padding:calc(.8rem * var(--bs)) calc(1.5rem * var(--bs));
  border-radius:1.6rem;background:var(--oc,#E1F5FE);border:5px solid var(--ocd,#29B6F6);box-shadow:0 .45rem 0 var(--ocd,#29B6F6);font-size:calc(1.7rem * var(--bs));font-weight:900;transition:transform .15s,box-shadow .15s,opacity .25s}
.opt:hover{transform:translateY(-4px)}
.opt:active{transform:translateY(4px);box-shadow:0 .1rem 0 var(--ocd)}
.opt .oi svg{width:calc(2.9rem * var(--bs));height:calc(2.9rem * var(--bs))}
.opts.text .opt{flex:1 1 13rem;max-width:21rem}
.opts.nums .opt{flex-direction:column;gap:.3rem;min-width:calc(7rem * var(--bs));padding:calc(.6rem * var(--bs)) calc(1.4rem * var(--bs))}
.bignum{font-size:calc(3.4rem * var(--bs));line-height:1}
.dotrow{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:center;max-width:7rem}
.dotrow i{width:1rem;height:1rem;border-radius:50%;background:var(--ocd);display:block}
.opts.pics .opt{flex-direction:column;gap:.4rem;padding:1rem}
.opts.pics.n2 .opt{width:min(calc(13rem * var(--bs)),40vw)}
.opts.pics.n3 .opt{width:min(calc(12rem * var(--bs)),25vw)}
.opts.pics .opt .oi{width:100%}
.opts.pics .opt .oi svg{width:100%;height:auto;max-height:calc(9rem * var(--bs))}
.opts.pics .opt .ol{font-size:calc(1.3rem * var(--bs))}
@media (max-width:640px){.opts.pics .opt{padding:.5rem;border-width:4px}.opts{gap:.7rem}}
.opt.right{background:#C8F7C5 !important;border-color:var(--goodD) !important;box-shadow:0 .45rem 0 var(--goodD) !important;animation:popB .6s}
.opt.right::after{content:"✔";position:absolute;top:-1rem;right:-.9rem;width:2.8rem;height:2.8rem;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:1.5rem;border:4px solid #fff}
.opt.wrong{animation:shake .5s;opacity:.6}
.opt.dim{opacity:.4;pointer-events:none}
@keyframes popB{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.fb{display:flex;align-items:center;justify-content:center;gap:.8rem;min-height:4.6rem;margin-top:1.4rem}
.mini{width:4.4rem;flex:none}
.fb .msg{font-size:clamp(1.3rem,3vw,1.85rem);padding:.6rem 1.3rem;border-radius:1.4rem;background:var(--card);border:4px solid var(--line)}
.fb.good .msg{background:#E8F5E9;border-color:#66BB6A;color:#1B5E20}
.fb.try .msg{background:#FFF3E0;border-color:#FFB74D;color:#7A4100}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem}
.navbtn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-size:calc(1.4rem * var(--bs));padding:calc(.8rem * var(--bs)) calc(1.6rem * var(--bs));border-radius:999px;background:var(--card);border:4px solid var(--line);box-shadow:var(--shadow);min-height:calc(4rem * var(--bs));transition:transform .15s}
.navbtn:active{transform:translateY(4px);box-shadow:none}
.navbtn.next{background:var(--sec);border-color:var(--secD);box-shadow:0 .4rem 0 var(--secD)}
.navbtn.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.navbtn.hide{visibility:hidden}
.spark{position:absolute;width:2.6rem;height:2.6rem;pointer-events:none;z-index:5;animation:spark 1.1s ease-out forwards}
.spark svg{width:100%;height:100%}
@keyframes spark{0%{transform:scale(0) rotate(0);opacity:1}50%{transform:scale(1.3) rotate(90deg);opacity:1}100%{transform:scale(0) rotate(180deg);opacity:0}}

/* ---------- Мақтау жазуы ---------- */
#praise{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:80}
#praise .pw{display:flex;flex-direction:column;align-items:center;gap:.4rem;animation:praiseIn 2.1s ease forwards;padding:0 1rem;text-align:center}
#praise .pstar{display:flex;gap:.6rem}
#praise .pstar svg{width:clamp(48px,8vw,80px)}
#praise .ptext{font-size:clamp(2.3rem,8vw,5.4rem);font-weight:900;color:#FF2E7E;-webkit-text-stroke:4px #fff;paint-order:stroke fill;text-shadow:0 .07em 0 #AD1457,0 .2em .35em rgba(0,0,0,.22);line-height:1.1}
@keyframes praiseIn{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08) translateY(-30px)}}
.flystar{position:fixed;left:0;top:0;width:70px;height:70px;z-index:85;pointer-events:none}
.flystar svg{width:100%;height:100%}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:79}

/* ---------- Марапат беті ---------- */
.reward{text-align:center;padding:.6rem 0 1rem}
.rwtitle{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;color:#E91E63;text-shadow:0 .07em 0 #fff,0 .13em 0 rgba(173,20,87,.25);line-height:1.1}
.rwsub{font-size:clamp(1.4rem,3.6vw,2.2rem);margin:.4rem 0 .2rem}
.rwstage{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:clamp(.5rem,3vw,2rem);margin:1rem 0 .6rem;min-height:clamp(220px,34vw,320px)}
.rwstage>*{position:relative;z-index:1}
.rays{position:absolute !important;z-index:0 !important;left:50%;top:50%;width:min(460px,92vw);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;opacity:.85;
  -webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
.rays svg{width:100%;height:100%}
.trophy{width:clamp(170px,28vw,250px);animation:trophy 1.8s ease-in-out infinite}
@keyframes trophy{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
.medal{width:clamp(80px,13vw,125px);transform-origin:50% 0;animation:swing 2.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.rwstars{display:flex;justify-content:center;gap:.6rem;margin:.4rem 0}
.rwstars svg{width:clamp(52px,9vw,80px);animation:starIn .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes starIn{from{transform:scale(0) rotate(-180deg)}to{transform:scale(1) rotate(0)}}
.rwinfo{font-size:clamp(1.2rem,2.8vw,1.6rem);margin:.6rem 0;color:var(--ink2)}
.rwbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:1rem;margin-top:1.2rem}

/* ---------- Қолжетімділік панелі ---------- */
#panelBack{position:fixed;inset:0;background:rgba(30,20,60,.45);z-index:90;display:none}
#panel{position:fixed;top:0;right:0;height:100%;width:min(470px,100%);background:var(--card);color:var(--ink);z-index:91;transform:translateX(105%);transition:transform .3s;overflow-y:auto;padding:1.2rem 1.1rem 2rem;border-left:5px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.2);visibility:hidden}
body.panel-open #panel{transform:none;visibility:visible}
body.panel-open #panelBack{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-bottom:1rem}
.ph h2{font-size:1.45rem;line-height:1.15}
.close{flex:none;width:3.4rem;height:3.4rem;border-radius:50%;background:#FFCDD2;border:4px solid #E57373;font-size:1.5rem}
.pgroup{margin-bottom:1.2rem}
.pgroup h3{font-size:1.08rem;color:var(--ink2);margin-bottom:.5rem}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:380px){.pgrid{grid-template-columns:1fr}}
.tile{display:flex;align-items:center;gap:.55rem;min-height:calc(4rem * var(--bs));padding:.55rem .75rem;border-radius:1.1rem;border:4px solid var(--line);background:var(--card);font-size:1rem;text-align:left;line-height:1.15}
.tile .ti{font-size:1.6rem;flex:none}
.tile .tl{flex:1}
.tile .st{flex:none;font-size:.78rem;padding:.15rem .45rem;border-radius:999px;background:#EEEAF6}
.tile[aria-pressed="true"]{border-color:#43A047;background:#E8F5E9}
.tile[aria-pressed="true"] .st{background:#43A047;color:#fff}
.sw{flex:none;width:2.6rem;height:2.6rem;border-radius:.7rem;border:3px solid #999;display:grid;place-items:center;font-size:1rem;font-weight:900}
.fontrow{display:flex;align-items:center;gap:.8rem}
.fontrow button{width:4.4rem;height:4.4rem;border-radius:1rem;border:4px solid var(--line);background:var(--card);font-size:1.6rem}
.fontrow .val{font-size:1.4rem;min-width:4.5rem;text-align:center}
.vnote{margin-top:.6rem;font-size:.92rem;color:var(--ink2);line-height:1.35}

body.t-dark{--ink:#fff;--ink2:#fff;--card:#000;--line:#fff;--bgA:#000;--bgB:#000;--bgC:#000;--sec:#000;--secD:#fff;--secS:#000;--shadow:none}

.contrast #decor,.contrast .rays{display:none}
.contrast .topbar{background:var(--card)}
.contrast .hbtn,.contrast .starbox,.contrast .scard,.contrast .go,.contrast .opt,.contrast .navbtn,.contrast .listen,.contrast .tile,.contrast .close,
.contrast .dot,.contrast .secchip,.contrast .ttitle,.contrast .bubble,.contrast .school,.contrast .fb .msg,.contrast .fontrow button,.contrast .tcard,
.contrast .champ,.contrast .donebadge,.contrast .scard .num{background:var(--card) !important;color:var(--ink) !important;border-color:var(--line) !important;box-shadow:none !important}
.contrast .tcard,.contrast .scard{border-width:6px}
.contrast .scene{background:var(--card);border-color:var(--line)}
.contrast .title .l,.contrast .rwtitle{color:var(--ink) !important;text-shadow:none}
.contrast .opt.right{border-width:9px !important;outline:4px dashed var(--line);outline-offset:4px}
.contrast .opt.right::after{background:var(--ink);color:var(--card);border-color:var(--card)}
.contrast .dot.done{background:var(--ink) !important;color:var(--card) !important}
.contrast .dot.cur{outline:4px solid var(--line);outline-offset:3px}
.contrast .dotrow i{background:var(--ink)}
.contrast .tile[aria-pressed="true"]{border-width:7px;border-style:double}
.contrast .tile[aria-pressed="true"] .st{background:var(--ink);color:var(--card)}
.contrast .tile .st{background:var(--card);border:2px solid var(--line)}
.contrast #praise .ptext{color:var(--ink);-webkit-text-stroke:4px var(--card);text-shadow:none}
.contrast #toast{border:3px solid var(--card)}
.t-bw svg,.t-bw .hi,.t-bw .li,.t-bw #confetti,.t-bw .emo{filter:grayscale(1) contrast(1.15)}

/* Контрастты күшейту */

/* Анимацияларды өшіру */
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none !important;transition:none !important}

/* ================= Дыбыстар (Web Audio) ================= */
var sfx = (function(){
  var ctx = null, master = null, noiseBuf = null;
  function ac(){
    if(!ctx){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      try { ctx = new C(); } catch(e){ return null; }
      master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
    return ctx;
  }
  function note(freq,t,dur,type,vol,dest){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol || .2, t+.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || master); o.start(t); o.stop(t+dur+.05);
  }
  function noise(){
    if(!noiseBuf){
      var len = Math.floor(ctx.sampleRate*.25);
      noiseBuf = ctx.createBuffer(1,len,ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    return noiseBuf;
  }
  function clap(t,vol){
    var s = ctx.createBufferSource(); s.buffer = noise();
    var bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 900+Math.random()*1500; bp.Q.value = .9;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+.09+Math.random()*.06);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t+.22);
  }
  function on(){ return settings.sfx && ac(); }
  return {
    ctx: ac,
    unlock: function(){ ac(); },
    correct: function(){
      if(!on()) return; var t = ctx.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){ note(f,t+i*.09,.35,'triangle',.22); });
      note(1567.98,t+.4,.6,'sine',.12);
    },
    applause: function(sec){
      if(!on()) return; sec = sec || 1.8;
      var t = ctx.currentTime+.15, n = Math.round(sec*40);
      for(var i=0;i<n;i++){
        var tt = t+Math.random()*sec, fade = 1-((tt-t)/sec)*.75;
        clap(tt,(.22+Math.random()*.35)*fade);
      }
    },
    soft: function(){
      if(!on()) return; var t = ctx.currentTime;
      note(440,t,.28,'sine',.12); note(392,t+.2,.4,'sine',.12);
    },
    tap: function(){ if(!on()) return; note(700,ctx.currentTime,.08,'sine',.07); },
    twinkle: function(){
      if(!on()) return; var t = ctx.currentTime;
      [1318.5,1760,2093].forEach(function(f,i){ note(f,t+i*.07,.3,'sine',.08); });
    },
    fanfare: function(){
      if(!on()) return; var t = ctx.currentTime;
      [[523.25,0,.18],[523.25,.2,.18],[523.25,.4,.18],[659.25,.6,.45],[587.33,1.1,.18],[659.25,1.3,.18],[783.99,1.5,.9]].forEach(function(n){
        note(n[0],t+n[1],n[2]+.12,'square',.06); note(n[0]/2,t+n[1],n[2]+.12,'triangle',.12);
      });
      [523.25,659.25,783.99,1046.5].forEach(function(f){ note(f,t+1.5,1.4,'triangle',.09); });
    }
  };
})();

var music = (function(){
  var timer = null, next = 0, idx = 0, gain = null, ctx = null;
  var MEL = [[523,1],[659,1],[784,1],[659,1],[698,1],[880,1],[784,2],
             [659,1],[587,1],[523,1],[587,1],[659,2],[523,2],
             [587,1],[698,1],[880,1],[698,1],[659,1],[784,1],[1047,2],
             [988,1],[880,1],[784,1],[698,1],[659,2],[523,2]];
  var BASS = [130.81,174.61,196,130.81];
  var BEAT = .32;
  function tone(f,t,d,type,v){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.03); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t+d+.05);
  }
  function sched(){
    while(next < ctx.currentTime+.45){
      var n = MEL[idx % MEL.length];
      tone(n[0],next,n[1]*BEAT*.92,'triangle',.07);
      if(idx % 4 === 0) tone(BASS[Math.floor(idx/4) % BASS.length],next,BEAT*3.5,'sine',.09);
      next += n[1]*BEAT; idx++;
    }
  }
  return {
    start: function(){
      ctx = sfx.ctx(); if(!ctx || timer) return;
      gain = ctx.createGain(); gain.gain.value = .0001; gain.connect(ctx.destination);
      gain.gain.setTargetAtTime(.6, ctx.currentTime, .5);
      next = ctx.currentTime+.1; idx = 0; timer = setInterval(sched, 90); sched();
    },
    stop: function(){
      if(timer){ clearInterval(timer); timer = null; }
      if(gain && ctx){ var g = gain; g.gain.setTargetAtTime(.0001, ctx.currentTime, .15); setTimeout(function(){ try{g.disconnect();}catch(e){} }, 900); gain = null; }
    },
    duck: function(on){ if(gain && ctx) gain.gain.setTargetAtTime(on ? .22 : .6, ctx.currentTime, .2); }
  };
})();

var voice = (function(){
  var ok = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
  var voices = [], tmo = null;
  function load(){ try { voices = speechSynthesis.getVoices() || []; } catch(e){ voices = []; } }
  if(ok){
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch(e){ speechSynthesis.onvoiceschanged = load; }
  }
  function kk(){ return voices.filter(function(v){ return /^kk/i.test(v.lang) || /kazakh|қазақ/i.test(v.name); }); }
  function choose(){
    var k = kk();
    if(k.length) return k[0];
    return voices.filter(function(v){ return /^ru/i.test(v.lang); })[0] || null;
  }
  function say(text, force){
    if(!ok){ if(force) toast('Бұл құрылғыда дауыстап оқу мүмкіндігі жоқ'); return; }
    if(!settings.narrator && !force) return;
    clearTimeout(tmo);
    try { speechSynthesis.cancel(); } catch(e){}
    tmo = setTimeout(function(){
      var u = new SpeechSynthesisUtterance(text);
      var v = choose();

var confetti = (function(){
  var cv = $('#confetti'), cx = cv.getContext('2d'), parts = [], raf = 0, W = 0, H = 0;
  var COLS = ['#FF5252','#FFD740','#69F0AE','#40C4FF','#E040FB','#FF6E40','#FFFF00','#FF80AB'];
  function size(){
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W*dpr); cv.height = Math.floor(H*dpr);
    cx.setTransform(dpr,0,0,dpr,0,0);
  }
  size(); window.addEventListener('resize', size);
  function starShape(r){
    cx.beginPath();
    for(var i=0;i<10;i++){ var rad = i%2 ? r*.45 : r, a = Math.PI/5*i - Math.PI/2; cx.lineTo(rad*Math.cos(a), rad*Math.sin(a)); }
    cx.closePath(); cx.fill();
  }
  function tick(){
    cx.clearRect(0,0,W,H);
    parts = parts.filter(function(p){ return p.life < p.max && p.y < H+40; });
    parts.forEach(function(p){
      p.life++; p.vx *= .99; p.vy = Math.min(p.vy + p.g, 6.5); p.x += p.vx + Math.sin(p.life/12)*.6; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
      cx.globalAlpha = Math.max(0, Math.min(1,(p.max-p.life)/30));
      cx.fillStyle = p.c;
      if(p.sh === 0) cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);
      else if(p.sh === 1){ cx.beginPath(); cx.arc(0,0,p.s/2.4,0,Math.PI*2); cx.fill(); }
      else starShape(p.s/1.5);
      cx.restore();
    });
    if(parts.length) raf = requestAnimationFrame(tick); else { raf = 0; cx.clearRect(0,0,W,H); }
  }
  function startLoop(){ if(!raf) raf = requestAnimationFrame(tick); }
  return {
    burst: function(x,y,n){
      if(settings.noanim) return;
      for(var i=0;i<n;i++){
        var a = Math.random()*Math.PI*2, v = 3+Math.random()*9;
        parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-7,g:.22+Math.random()*.1,s:7+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:COLS[i%COLS.length],sh:i%3,life:0,max:140+Math.random()*60});
      }
      startLoop();
    },
    rain: function(n){
      if(settings.noanim) return;
      for(var i=0;i<n;i++){
        parts.push({x:Math.random()*W,y:-20-Math.random()*H*.6,vx:(Math.random()-.5)*2,vy:1+Math.random()*3,g:.05,s:7+Math.random()*9,r:Math.random()*6,vr:(Math.random()-.5)*.25,c:COLS[i%COLS.length],sh:i%3,life:0,max:320});
      }
      startLoop();
    }
  };
})();

  setTimeout(function(){ confetti.burst(window.innerWidth*.5, window.innerHeight*.3, 120); }, 1800);
  voice.say('Құттықтаймын! Сен барлық тапсырманы орындадың!' + (allDone ? ' Сен нағыз чемпионсың!' : ''));
}

/* ================= Қолжетімділік панелі ================= */
function renderPanel(){
  function tog(act, ic, label, on){
    return `<button class="tile" data-act="${act}" aria-pressed="${on}"><span class="ti">${ic}</span><span class="tl">${label}</span><span class="st">${on?'ҚОСУЛЫ':'ӨШІРУЛІ'}</span></button>`;
  }
  function th(val, label, sw){
    var on = settings.theme === val;
    return `<button class="tile" data-act="theme:${val}" aria-pressed="${on}"><span class="sw" style="${sw}">Аа</span><span class="tl">${label}</span><span class="st">${on?'✔':''}</span></button>`;
  }
  var vnote = '';
  if(!voice.ok) vnote = 'Бұл браузерде дауыстап оқу жоқ. Chrome немесе Edge браузерін қолданыңыз.';
  else if(voice.count() && !voice.hasKazakh()) vnote = 'Құрылғыда қазақ дауысы табылмады, жақын дауыс қолданылады. Ең жақсы қазақша дауыс — Microsoft Edge браузерінде.';
  var pct = Math.round(settings.fs*100);
  $('#panel').innerHTML = `
<div class="ph"><h2>👁️ Көру және дыбыс баптаулары</h2><button class="close" data-act="close" aria-label="Жабу">✖</button></div>
<div class="pgroup"><h3>Түс режимі</h3><div class="pgrid">
  ${th('color','Түрлі-түсті','background:linear-gradient(135deg,#FFD54F,#4FC3F7,#F48FB1,#81C784);color:#33275A')}
  ${th('bw','Ақ-қара режим','background:linear-gradient(90deg,#000 50%,#fff 50%);color:#888')}
  ${th('dark','Қара фон, ақ мәтін','background:#000;color:#fff;border-color:#000')}
  ${th('light','Ақ фон, қара мәтін','background:#fff;color:#000;border-color:#000')}
</div></div>
<div class="pgroup"><h3>Қаріп өлшемі</h3><div class="fontrow">
  <button data-act="fs-" aria-label="Қаріпті кішірейту">A−</button><span class="val">${pct}%</span><button data-act="fs+" aria-label="Қаріпті үлкейту">A+</button>
</div></div>
<div class="pgroup"><h3>Көрініс</h3><div class="pgrid">
  ${tog('big','🔲','Батырмаларды үлкейту',settings.big)}
  ${tog('hc','🔆','Контрастты күшейту',settings.hc)}
  ${tog('anim','🎬','Анимациялар',!settings.noanim)}
</div></div>
<div class="pgroup"><h3>Дыбыс</h3><div class="pgrid">
  ${tog('sfx','🔔','Дыбыстық сүйемелдеу',settings.sfx)}
  ${tog('narrator','🗣️','Диктор',settings.narrator)}
  ${tog('music','🎵','Музыка',settings.music)}
  <button class="tile" data-act="test"><span class="ti">🔊</span><span class="tl">Дауысты тексеру</span></button>
</div>${vnote ? `<p class="vnote">${vnote}</p>` : ''}</div>
<button class="tile wide" data-act="reset"><span class="ti">↺</span><span class="tl" style="flex:none">Бастапқы баптауларға қайту</span></button>`;
}
function applySettings(){
  var b = document.body;
  ['t-color','t-dark','t-light','t-bw'].forEach(function(c){ b.classList.remove(c); });
  b.classList.add('t-' + settings.theme);
  b.classList.toggle('contrast', settings.theme !== 'color');
  b.classList.toggle('hc', settings.hc);
  b.classList.toggle('noanim', settings.noanim);
  b.classList.toggle('bigbtn', settings.big);
  document.documentElement.style.setProperty('--fs', settings.fs);
  var meta = document.querySelector('meta[name=theme-color]');
  if(meta) meta.setAttribute('content', settings.theme === 'dark' ? '#000000' : (settings.theme === 'color' ? '#B3E5FC' : '#ffffff'));
  updateHeader(); renderPanel(); saveSettings();
}
function updateHeader(){
  var mb = $('#musicBtn'), vb = $('#voiceBtn');
  mb.setAttribute('aria-pressed', settings.music); mb.classList.toggle('off', !settings.music);
  mb.querySelector('.hi').textContent = settings.music ? '🎵' : '🔕';
  vb.setAttribute('aria-pressed', settings.narrator); vb.classList.toggle('off', !settings.narrator);
  vb.querySelector('.hi').textContent = settings.narrator ? '🗣️' : '🔇';
  $('#homeBtn').classList.toggle('hide', state.screen === 'home');
  $('#starCount').textContent = state.stars;
}
function openPanel(){ document.body.classList.add('panel-open'); var c = $('#panel .close'); if(c) c.focus(); }
function closePanel(){ document.body.classList.remove('panel-open'); $('#a11yBtn').focus(); }
function setMusic(on){
  settings.music = on;
  if(on) music.start(); else music.stop();
}
function setNarrator(on){
  settings.narrator = on;
  if(on) voice.say('Диктор қосылды'); else voice.stop();
}
$('#panel').addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if(!b) return;
  var act = b.getAttribute('data-act');
  sfx.tap();
  if(act === 'close'){ closePanel(); return; }
  if(act.indexOf('theme:') === 0){
    settings.theme = act.slice(6);
    toast({color:'Түрлі-түсті режим',bw:'Ақ-қара режим қосылды',dark:'Қара фон, ақ мәтін',light:'Ақ фон, қара мәтін'}[settings.theme]);
  }
  else if(act === 'fs-' || act === 'fs+'){
    var idx = FS.indexOf(settings.fs); if(idx < 0) idx = 1;
    idx = Math.max(0, Math.min(FS.length-1, idx + (act === 'fs+' ? 1 : -1)));
    settings.fs = FS[idx];
  }
  else if(act === 'big') settings.big = !settings.big;
  else if(act === 'hc') settings.hc = !settings.hc;
  else if(act === 'anim') settings.noanim = !settings.noanim;
  else if(act === 'sfx'){ settings.sfx = !settings.sfx; if(settings.sfx) sfx.correct(); }
  else if(act === 'narrator') setNarrator(!settings.narrator);
  else if(act === 'music') setMusic(!settings.music);
  else if(act === 'test'){ voice.say('Сәлем, досым! Мен сенің дикторыңмын.', true); return; }
  else if(act === 'reset'){
    var m = settings.music;
    settings = Object.assign(settings, DEF);
    if(m) music.stop();
    toast('Бастапқы баптаулар қайтарылды');
  }
  applySettings();
  var again = $('#panel [data-act="' + act + '"]'); if(again) again.focus();
});

/* ================= Жоғарғы батырмалар ================= */
$('#homeBtn').addEventListener('click', function(){ sfx.tap(); renderHome(); });
$('#musicBtn').addEventListener('click', function(){ setMusic(!settings.music); applySettings(); toast(settings.music ? '🎵 Музыка қосылды' : '🔕 Музыка өшірілді'); });
$('#voiceBtn').addEventListener('click', function(){ setNarrator(!settings.narrator); applySettings(); toast(settings.narrator ? '🗣️ Диктор қосылды' : '🔇 Диктор өшірілді'); });
$('#a11yBtn').addEventListener('click', function(){ sfx.tap(); openPanel(); });
$('#panelBack').addEventListener('click', closePanel);
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && document.body.classList.contains('panel-open')) closePanel(); });

/* Браузер дыбысты алғашқы басудан кейін ғана рұқсат етеді */
var unlocked = false;
function firstGesture(){
  if(unlocked) return; unlocked = true;
  sfx.unlock();
  if(settings.music) music.start();
}
document.addEventListener('pointerdown', firstGesture, true);
document.addEventListener('keydown', firstGesture, true);

/* ================= Іске қосу ================= */
$('#starIcon').innerHTML = MINI_STAR;
applySettings();
renderHome();
})();
</script>
</body>
</html>
